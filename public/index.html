<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="Gestion Hôpital — plateforme de gestion hospitalière : patients, rendez-vous, consultations, ordonnances, laboratoire, pharmacie et facturation."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script>
      // Anti-FOUC : applique le thème AVANT le premier rendu (ADR-004).
      // Lit la préférence stockée par ThemeProvider ('gh.theme') ;
      // 'auto' suit prefers-color-scheme.
      (function () {
        try {
          var t = localStorage.getItem('gh.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* stockage indisponible : thème par défaut (clair) */
        }
      })();
    </script>
    <title>Gestion Hôpital</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
